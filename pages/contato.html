<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Formulário demonstrativo de contato do projeto Luna."><title>Contato | Luna</title><link rel="stylesheet" href="../assets/css/styles.css"><script src="../assets/js/site.js" defer></script><script src="../assets/js/contact-demo.js" defer></script></head>
<body data-root="../" data-page="contato" class="is-loading">
  <div class="skeleton-overlay">
    <div class="skeleton-loader">
      <div class="skeleton-text-block">
        <div class="skeleton-row title"></div>
        <div class="skeleton-row subtitle"></div>
        <div class="skeleton-row long"></div>
        <div class="skeleton-row medium"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-row short"></div>
        <div class="skeleton-row medium"></div>
        <div class="skeleton-row long"></div>
        <div class="skeleton-row medium"></div>
        <div class="skeleton-row short"></div>
      </div>
    </div>
  </div>
  <header id="site-header"></header><main>
<section class="page-intro page-width"><p class="eyebrow">Contato</p><h1>Vamos conversar<br><em>sobre o projeto.</em></h1><p>O formulário abaixo valida os campos no navegador, mas não envia mensagens: nenhum serviço de recebimento foi configurado.</p></section>
<section class="content-section page-width"><form class="panel" id="contact-form" style="max-width:680px"><div class="field"><label for="name">Nome</label><input id="name" name="name" autocomplete="name" required maxlength="100"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="200"></div><div class="field"><label for="subject">Assunto</label><input id="subject" name="subject" required maxlength="120"></div><div class="field"><label for="message">Mensagem</label><textarea id="message" name="message" required maxlength="2000"></textarea></div><button class="button button-dark" type="submit">Validar formulário</button><p class="form-message" id="contact-status" role="status">Demonstração: os dados não serão enviados nem armazenados.</p></form></section>
</main><footer id="site-footer"></footer></body></html>
