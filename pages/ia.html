<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Converse com a Luna e explore formas práticas de organizar suas finanças."><title>Luna | Converse com a Luna</title><link rel="stylesheet" href="../assets/css/styles.css"><script src="../assets/js/site.js" defer></script><script src="../assets/js/ai-demo.js" defer></script></head>
<body data-root="../" data-page="ia" class="is-loading">
  <div class="skeleton-overlay">
    <div class="skeleton-loader">
      <div class="skeleton-text-block">
        <div class="skeleton-row title"></div>
        <div class="skeleton-row subtitle"></div>
        <div class="skeleton-row long"></div>
        <div class="skeleton-row medium"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-row short"></div>
        <div class="skeleton-row medium"></div>
        <div class="skeleton-row long"></div>
        <div class="skeleton-row short"></div>
        <div class="skeleton-row medium"></div>
      </div>
    </div>
  </div>
  <header id="site-header"></header><main>
<section class="content-section page-width"><div class="panel chat-panel">
<div class="conversation" id="conversation" aria-live="polite"><div class="message assistant">Oi! Sou a Luna. Posso conversar sobre a proposta e organização financeira cotidiana.</div></div>
<div class="chat-composer">
<div class="suggestions" aria-label="Sugestões de perguntas"><button class="suggestion" type="button">Como a Luna pode ajudar?</button><button class="suggestion" type="button">Posso tirar dúvidas sobre os resultados?</button><button class="suggestion" type="button">O que ainda falta definir?</button></div>
<form id="chat-form"><div class="field"><label for="prompt">Sua mensagem</label><textarea id="prompt" maxlength="600" required placeholder="Digite uma pergunta..." rows="2"></textarea></div><div class="button-row"><button class="button button-dark" type="submit">Enviar</button><button class="button button-light" type="button" id="clear-chat">Limpar conversa</button></div><p class="form-message" id="chat-status" role="status"></p></form>
</div>
</div></section>
</main></body></html>
